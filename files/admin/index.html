<!DOCTYPE html>
<html lang="sr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Admin · Creatives by Andrej</title>
<meta name="theme-color" content="#0c0c0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0c0c'/%3E%3Cpath d='M39.6 42.6A15 15 0 1 1 39.6 21.4' fill='none' stroke='%23f5f5f5' stroke-width='8.5' stroke-linecap='round'/%3E%3Cpath d='M50 18V50' stroke='%237cc7ff' stroke-width='4' stroke-linecap='round'/%3E%3Crect x='45' y='9' width='10' height='10' rx='3' fill='%237cc7ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  try { var th = localStorage.getItem('cba-theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}
</script>
<style>
  :root {
    --bg: #0c0c0c; --panel: #161616; --panel-2: #1e1e1e; --panel-3: #2a2a2a;
    --line: rgba(255,255,255,.08);
    --text: #f5f5f5; --muted: rgba(245,245,245,.64); --dim: rgba(245,245,245,.4);
    --accent: #7cc7ff; --btn: #fff; --btn-text: #0c0c0c; --danger: #ff8a65;
    --ease: cubic-bezier(.16,1,.3,1);
    --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #ebebea; --panel: #fff; --panel-2: #f3f3f2; --panel-3: #e4e4e3;
    --line: rgba(0,0,0,.08);
    --text: #0f0f0f; --muted: rgba(15,15,15,.64); --dim: rgba(15,15,15,.45);
    --accent: #0a7fd0; --btn: #0f0f0f; --btn-text: #fff; --danger: #d9480f;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
  [hidden] { display: none !important; }

  .container { max-width: 880px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 32px); }
  header { padding: 20px 0; }
  header .container { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .logo { display: inline-flex; align-items: center; gap: 12px; }
  .logo-mark { width: 34px; height: 34px; overflow: visible; color: var(--text); }
  .logo-mark .c { fill: none; stroke: currentColor; stroke-width: 9; stroke-linecap: round; }
  .logo-mark .ph path { stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; }
  .logo-mark .ph rect { fill: var(--accent); }
  .logo-word { font-weight: 700; letter-spacing: -.03em; }
  .link { color: var(--muted); font-size: 14px; font-weight: 500; }
  .link:hover { color: var(--text); }

  main { padding: 16px 0 64px; }
  h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 700; letter-spacing: -.035em; line-height: 1.1; margin: 0 0 6px; }
  h2 { font-size: 20px; font-weight: 700; letter-spacing: -.025em; margin: 0; }
  .lede { color: var(--muted); margin: 0 0 28px; }
  .panel { background: var(--panel); border-radius: 22px; padding: clamp(18px, 3vw, 28px); }
  .panel + .panel { margin-top: 16px; }

  label.f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  input[type=text], input[type=password], select {
    height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font-size: 15px; width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 140px; gap: 12px; margin-top: 16px; }
  .grid .title { grid-column: 1 / -1; }
  .slug {
    display: flex; align-items: center; height: 46px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel-2); overflow: hidden;
  }
  .slug:focus-within { border-color: var(--accent); }
  .slug-pre { padding-left: 14px; color: var(--dim); font-size: 15px; font-weight: 500; white-space: nowrap; }
  .slug input { border: 0; background: none; height: 100%; padding: 0 14px 0 1px; min-width: 0; flex: 1; font-weight: 600; }
  .slug input:focus { border: 0; }
  .slug-state { font-size: 12px; font-weight: 500; min-height: 18px; color: var(--dim); }
  .slug-state.ok { color: var(--accent); }
  .slug-state.bad { color: var(--danger); }
  @media (max-width: 640px) { .slug-pre { font-size: 13px; padding-left: 12px; } }

  .drop {
    display: grid; place-items: center; text-align: center; gap: 6px;
    min-height: 150px; padding: 24px; border-radius: 16px;
    border: 1.5px dashed var(--line); background: var(--panel-2); cursor: pointer;
    transition: border-color .3s var(--ease), background-color .3s var(--ease);
  }
  .drop:hover, .drop.is-over { border-color: var(--accent); }
  .drop strong { font-size: 16px; font-weight: 600; }
  .drop span { color: var(--dim); font-size: 13px; }
  .file { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 16px; background: var(--panel-2); }
  .file img { width: 96px; height: 54px; object-fit: cover; border-radius: 8px; background: #000; flex: none; }
  .file .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .info { color: var(--dim); font-size: 13px; }
  .file > div { min-width: 0; flex: 1; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    height: 46px; padding: 0 22px; border-radius: 999px;
    background: var(--btn); color: var(--btn-text); font-weight: 600; letter-spacing: -.01em; white-space: nowrap;
    transition: transform .3s var(--ease), opacity .3s var(--ease);
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .4; cursor: default; transform: none; }
  .btn--ghost { background: var(--panel-3); color: var(--text); }
  .btn--sm { height: 34px; padding: 0 14px; font-size: 13px; }
  .btn--danger { color: var(--danger); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
  .msg { font-size: 14px; color: var(--muted); }
  .msg.err { color: var(--danger); }

  .bar { height: 6px; border-radius: 999px; background: var(--panel-3); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .2s linear; }
  .progress { margin-top: 18px; display: grid; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .done { margin-top: 18px; padding: 16px; border-radius: 16px; background: color-mix(in srgb, var(--accent) 12%, var(--panel-2)); }
  .done .url { font-weight: 600; word-break: break-all; margin: 4px 0 12px; }

  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .usage { min-width: 180px; display: grid; gap: 6px; font-size: 12px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
  .item { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
  .item img { width: 80px; height: 45px; object-fit: cover; border-radius: 8px; background: #000; flex: none; }
  .item .t { min-width: 0; flex: 1; }
  .item .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .t span { color: var(--dim); font-size: 13px; }
  .item .acts { display: flex; gap: 6px; flex: none; }
  .empty { color: var(--dim); padding: 12px 0 4px; }

  .login { max-width: 380px; margin: 10vh auto 0; }
  .login form { display: grid; gap: 12px; margin-top: 20px; }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .item { flex-wrap: wrap; }
    .item .acts { width: 100%; padding-left: 94px; }
    .logo-word { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="container">
    <a class="logo" href="/" aria-label="Creatives by Andrej">
      <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true"><path class="c" d="M44 44A17 17 0 1 1 44 20"/><g class="ph"><path d="M54 17V52"/><rect x="49" y="8" width="10" height="11" rx="3"/></g></svg>
      <span class="logo-word">Creatives by Andrej</span>
    </a>
    <button class="link" id="logout" hidden>Odjavi se</button>
  </div>
</header>

<main>
  <!-- Login -->
  <section class="container login" id="loginView" hidden>
    <h1>Admin</h1>
    <p class="lede" style="margin:0">Samo za tebe. Unesi lozinku.</p>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="Lozinka" autocomplete="current-password" required>
      <button class="btn" type="submit">Prijavi se</button>
      <p class="msg err" id="loginMsg" hidden></p>
    </form>
  </section>

  <!-- App -->
  <div class="container" id="appView" hidden>
    <h1>Linkovi za klijente</h1>
    <p class="lede">Ubaci video i dobićeš privatan link na svom sajtu.</p>

    <section class="panel">
      <h2>Novi link</h2>
      <div style="margin-top:16px">
        <label class="drop" id="drop">
          <input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.webm" hidden>
          <strong>Prevuci video ovde ili klikni</strong>
          <span>MP4 (H.264) radi svuda. Najbolje ispod ~200 MB.</span>
        </label>
        <div class="file" id="fileCard" hidden>
          <img id="fileThumb" alt="">
          <div>
            <div class="name" id="fileName"></div>
            <div class="info" id="fileInfo"></div>
          </div>
          <button class="btn btn--ghost btn--sm" id="fileClear" type="button">Promeni</button>
        </div>
      </div>
      <div class="grid">
        <label class="f title">Naziv
          <input type="text" id="title" maxlength="140" placeholder="npr. Spotify promo v2">
        </label>
        <label class="f title">Link
          <div class="slug">
            <span class="slug-pre" id="slugPre">creativesbyandrej.design/r/</span>
            <input type="text" id="slug" maxlength="60" placeholder="spotify-promo-v2" autocomplete="off" spellcheck="false">
          </div>
          <span class="slug-state" id="slugState"></span>
        </label>
        <label class="f">Klijent (nije obavezno)
          <input type="text" id="client" maxlength="80" placeholder="Ime klijenta">
        </label>
        <label class="f">Jezik stranice
          <select id="lang"><option value="sr">Srpski</option><option value="en">English</option></select>
        </label>
      </div>
      <div class="row">
        <button class="btn" id="go" disabled>Napravi link</button>
        <span class="msg" id="formMsg"></span>
      </div>
      <div class="progress" id="progress" hidden>
        <div class="bar"><i id="barFill"></i></div>
        <span id="progressText">0%</span>
      </div>
      <div class="done" id="done" hidden>
        <div class="msg">Link je spreman:</div>
        <div class="url" id="doneUrl"></div>
        <div class="row" style="margin:0">
          <button class="btn btn--sm" id="copyNew">Kopiraj link</button>
          <a class="btn btn--ghost btn--sm" id="openNew" target="_blank" rel="noopener">Otvori</a>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="list-head">
        <h2>Aktivni linkovi</h2>
        <div class="usage">
          <span id="usageText">…</span>
          <div class="bar"><i id="usageFill"></i></div>
        </div>
      </div>
      <div id="list"></div>
    </section>
  </div>
</main>

<script type="module">
  import { uploadPresigned as upload } from '/admin/blob-client.js';

  const $ = (s) => document.querySelector(s);
  const STORAGE_LIMIT = 1024 ** 3; // Vercel Blob Hobby plan: 1 GB
  let file = null, probe = null;

  const fmtSize = (b) => b >= 1024 ** 3 ? (b / 1024 ** 3).toFixed(2) + ' GB' : b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB';
  const fmtDur = (s) => { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const linkFor = (id) => location.origin + '/r/' + id + '/';
  const slugify = (s) => s.normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'dj').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'video';
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function api(path, opts = {}) {
    const res = await fetch(path, { credentials: 'same-origin', ...opts, headers: { 'content-type': 'application/json', ...(opts.headers || {}) } });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && path !== '/api/login') { show(false); throw new Error('Nisi prijavljen.'); }
    if (!res.ok) throw new Error(data.error || 'Greška (' + res.status + ')');
    return data;
  }

  function show(admin) {
    $('#loginView').hidden = admin;
    $('#appView').hidden = !admin;
    $('#logout').hidden = !admin;
    if (admin) loadList(); else setTimeout(() => $('#pw').focus(), 50);
  }

  /* ---------- auth ---------- */
  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = $('#loginMsg');
    msg.hidden = true;
    try {
      await api('/api/login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) });
      $('#pw').value = '';
      show(true);
    } catch (err) {
      msg.textContent = err.message === 'Wrong password.' ? 'Pogrešna lozinka.' : err.message;
      msg.hidden = false;
    }
  });
  $('#logout').addEventListener('click', async () => { await api('/api/login', { method: 'DELETE' }); show(false); });

  /* ---------- file pick + local probe (size, length, poster frame) ---------- */
  function probeVideo(f) {
    return new Promise((resolve) => {
      const v = document.createElement('video');
      const url = URL.createObjectURL(f);
      let settled = false;
      const finish = (r) => { if (settled) return; settled = true; URL.revokeObjectURL(url); resolve(r); };
      v.muted = true; v.preload = 'auto'; v.playsInline = true; v.src = url;
      v.addEventListener('loadedmetadata', () => { v.currentTime = Math.min(1, (v.duration || 0) / 2); });
      v.addEventListener('seeked', () => {
        const w = v.videoWidth, h = v.videoHeight;
        const scale = Math.min(1, 1280 / Math.max(w, h));
        const c = document.createElement('canvas');
        c.width = Math.round(w * scale); c.height = Math.round(h * scale);
        c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        c.toBlob((poster) => finish({ w, h, duration: v.duration, poster }), 'image/jpeg', 0.85);
      }, { once: true });
      v.addEventListener('error', () => finish(null));
      setTimeout(() => finish(null), 15000);
    });
  }

  async function pick(f) {
    if (!f) return;
    if (!/^video\//.test(f.type) && !/\.(mp4|mov|webm)$/i.test(f.name)) { $('#formMsg').textContent = 'To nije video fajl.'; return; }
    file = f; probe = null;
    $('#done').hidden = true; $('#formMsg').textContent = ''; $('#formMsg').className = 'msg';
    $('#drop').hidden = true; $('#fileCard').hidden = false;
    $('#fileName').textContent = f.name;
    $('#fileInfo').textContent = fmtSize(f.size) + ' · čitam video…';
    $('#fileThumb').removeAttribute('src');
    if (!$('#title').value) { $('#title').value = f.name.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' '); syncSlug(); }
    probe = await probeVideo(f);
    if (file !== f) return;
    const warn = f.size > 300 * 1048576 ? ' · veliki fajl, troši mnogo od mesečnog limita' : '';
    if (probe) {
      $('#fileInfo').textContent = `${fmtSize(f.size)} · ${fmtDur(probe.duration)} · ${probe.w}×${probe.h}${warn}`;
      if (probe.poster) $('#fileThumb').src = URL.createObjectURL(probe.poster);
    } else {
      $('#fileInfo').textContent = `${fmtSize(f.size)} · browser ne može da pročita ovaj format, klijent ga možda neće videti. Izvezi kao MP4 (H.264).${warn}`;
    }
    $('#go').disabled = false;
  }

  const drop = $('#drop');
  $('#fileInput').addEventListener('change', (e) => pick(e.target.files[0]));
  ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('is-over'); }));
  ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, () => drop.classList.remove('is-over')));
  drop.addEventListener('drop', (e) => { e.preventDefault(); pick(e.dataTransfer.files[0]); });
  $('#fileClear').addEventListener('click', () => {
    file = null; probe = null; $('#fileInput').value = '';
    $('#fileCard').hidden = true; $('#drop').hidden = false; $('#go').disabled = true;
  });

  /* ---------- link name (slug) ---------- */
  // Follows the title until you edit it yourself; checks that the name is free.
  let slugEdited = false, slugTimer = 0, slugSeq = 0;
  const cleanSlug = (s) => s.toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/-{2,}/g, '-').replace(/^-+|-+$/g, '').slice(0, 60).replace(/-+$/, '');
  function setSlugState(text, cls) { const el = $('#slugState'); el.textContent = text; el.className = 'slug-state ' + cls; }
  function checkSlug() {
    clearTimeout(slugTimer);
    const s = cleanSlug($('#slug').value);
    if (!s) return setSlugState('', '');
    setSlugState('Proveravam…', '');
    const seq = ++slugSeq;
    slugTimer = setTimeout(async () => {
      try {
        const { exists } = await api('/api/reviews?exists=' + encodeURIComponent(s));
        if (seq !== slugSeq) return;
        exists ? setSlugState('Zauzeto, upiši drugo ime.', 'bad') : setSlugState('✓ Slobodno: ' + linkFor(s).replace(/^https?:\/\//, ''), 'ok');
      } catch { if (seq === slugSeq) setSlugState('', ''); }
    }, 350);
  }
  function syncSlug() {
    if (slugEdited) return;
    const t = $('#title').value.trim();
    $('#slug').value = t ? slugify(t) : '';
    checkSlug();
  }
  $('#slugPre').textContent = location.host.replace(/^www\./, '') + '/r/';
  $('#title').addEventListener('input', syncSlug);
  $('#slug').addEventListener('input', (e) => {
    const el = e.target;
    el.value = el.value.normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'dj').toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/-{2,}/g, '-').replace(/^-/, '');
    slugEdited = el.value !== '';
    checkSlug();
  });
  $('#slug').addEventListener('blur', (e) => { e.target.value = cleanSlug(e.target.value); });

  /* ---------- upload ---------- */
  $('#go').addEventListener('click', async () => {
    if (!file) return;
    const go = $('#go'), msg = $('#formMsg');
    go.disabled = true; $('#fileClear').disabled = true;
    msg.className = 'msg'; msg.textContent = '';
    $('#done').hidden = true;
    const title = $('#title').value.trim() || file.name;
    const id = cleanSlug($('#slug').value) || slugify(title);
    try {
      const { exists } = await api('/api/reviews?exists=' + encodeURIComponent(id));
      if (exists) throw new Error(`link „${id}“ je već zauzet, upiši drugi.`);
    } catch (err) {
      msg.className = 'msg err'; msg.textContent = 'Nije uspelo: ' + err.message;
      go.disabled = false; $('#fileClear').disabled = false;
      return;
    }
    $('#progress').hidden = false;
    const ext = (file.name.match(/\.(mp4|mov|webm)$/i) || ['', 'mp4'])[1].toLowerCase();
    const fileName = slugify(title) + '.' + ext;
    try {
      let posterUrl = '';
      if (probe && probe.poster) {
        const p = await upload(`reviews/${id}/poster.jpg`, probe.poster, { access: 'public', handleUploadUrl: '/api/upload', contentType: 'image/jpeg' });
        posterUrl = p.url;
      }
      const t0 = performance.now();
      const v = await upload(`reviews/${id}/${fileName}`, file, {
        access: 'public',
        handleUploadUrl: '/api/upload',
        multipart: file.size > 50 * 1048576,
        contentType: file.type || 'video/mp4',
        onUploadProgress: ({ loaded, total, percentage }) => {
          $('#barFill').style.width = percentage + '%';
          const secs = (performance.now() - t0) / 1000;
          const rate = loaded / Math.max(secs, 0.1);
          const left = rate > 0 ? Math.round((total - loaded) / rate) : 0;
          $('#progressText').textContent = `${Math.round(percentage)}% · ${fmtSize(loaded)} / ${fmtSize(total)}` + (percentage < 100 && secs > 2 ? ` · još ~${fmtDur(left)}` : '');
        },
      });
      $('#progressText').textContent = 'Čuvam stranicu…';
      await api('/api/reviews', { method: 'POST', body: JSON.stringify({
        id, title, fileName,
        client: $('#client').value.trim(), lang: $('#lang').value,
        w: probe?.w, h: probe?.h, duration: probe?.duration,
        video: v.url, poster: posterUrl,
      }) });
      $('#progress').hidden = true;
      $('#doneUrl').textContent = linkFor(id);
      $('#openNew').href = linkFor(id);
      $('#done').hidden = false;
      $('#fileClear').click(); $('#title').value = ''; $('#client').value = '';
      $('#slug').value = ''; slugEdited = false; setSlugState('', '');
      loadList();
    } catch (err) {
      $('#progress').hidden = true;
      let detail = err.message;
      if (/presigned URL|client token/i.test(detail)) {
        // The Blob SDK hides the server's reason; ask the route directly.
        try {
          const r = await fetch('/api/upload', { method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ type: 'blob.generate-presigned-url', payload: { pathname: `reviews/${id}/probe.jpg`, clientPayload: null, multipart: false } }) });
          const d = await r.json().catch(() => ({}));
          if (d.error) detail += ' (server: ' + d.error + ')';
        } catch {}
      }
      msg.className = 'msg err'; msg.textContent = 'Nije uspelo: ' + detail;
      go.disabled = false;
    } finally {
      $('#fileClear').disabled = false; $('#barFill').style.width = '0';
    }
  });

  async function copy(text, btn) {
    try { await navigator.clipboard.writeText(text); } catch { prompt('Kopiraj link:', text); return; }
    const old = btn.textContent; btn.textContent = 'Kopirano ✓';
    setTimeout(() => (btn.textContent = old), 1500);
  }
  $('#copyNew').addEventListener('click', (e) => copy($('#doneUrl').textContent, e.currentTarget));

  /* ---------- list ---------- */
  async function loadList() {
    const box = $('#list');
    try {
      const { items, used } = await api('/api/reviews');
      $('#usageText').textContent = `${fmtSize(used)} od 1 GB`;
      $('#usageFill').style.width = Math.min(100, (used / STORAGE_LIMIT) * 100) + '%';
      if (!items.length) { box.innerHTML = '<p class="empty">Još nema linkova.</p>'; return; }
      box.innerHTML = items.map((m) => `
        <div class="item" data-id="${esc(m.id)}">
          ${m.poster ? `<img src="${esc(m.poster)}" alt="" loading="lazy">` : '<img alt="">'}
          <div class="t">
            <b>${esc(m.title)}</b>
            <span>${m.client ? esc(m.client) + ' · ' : ''}${new Date(m.created).toLocaleDateString('sr-Latn')} · ${fmtDur(m.duration)} · ${fmtSize(m.bytes)}</span>
          </div>
          <div class="acts">
            <button class="btn btn--sm" data-act="copy">Kopiraj</button>
            <a class="btn btn--ghost btn--sm" href="/r/${esc(m.id)}/" target="_blank" rel="noopener">Otvori</a>
            <button class="btn btn--ghost btn--sm btn--danger" data-act="del">Obriši</button>
          </div>
        </div>`).join('');
    } catch (err) {
      if ($('#appView').hidden) return;
      box.innerHTML = `<p class="empty msg err">${esc(err.message)}</p>`;
    }
  }

  $('#list').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const item = btn.closest('.item');
    const id = item.dataset.id;
    if (btn.dataset.act === 'copy') return copy(linkFor(id), btn);
    if (!confirm(`Obrisati „${item.querySelector('b').textContent}“? Link prestaje da radi i video se briše. Ovo ne može da se vrati.`)) return;
    btn.disabled = true; btn.textContent = 'Brišem…';
    try { await api('/api/reviews?id=' + encodeURIComponent(id), { method: 'DELETE' }); item.remove(); loadList(); }
    catch (err) { alert(err.message); btn.disabled = false; btn.textContent = 'Obriši'; }
  });

  api('/api/login').then((d) => show(!!d.admin)).catch(() => show(false));
</script>
</body>
</html>
