<!DOCTYPE html>
<html lang="{{LANG}}" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>{{TITLE}} · Creatives by Andrej</title>
<meta name="theme-color" content="#0c0c0c">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{T_OG}}">
<meta property="og:type" content="video.other">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0c0c'/%3E%3Cpath d='M39.6 42.6A15 15 0 1 1 39.6 21.4' fill='none' stroke='%23f5f5f5' stroke-width='8.5' stroke-linecap='round'/%3E%3Cpath d='M50 18V50' stroke='%237cc7ff' stroke-width='4' stroke-linecap='round'/%3E%3Crect x='45' y='9' width='10' height='10' rx='3' fill='%237cc7ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      var th = localStorage.getItem('cba-theme');
      if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #0c0c0c; --panel: #161616; --panel-3: #2a2a2a;
    --text: #f5f5f5; --muted: rgba(245,245,245,.64); --dim: rgba(245,245,245,.4);
    --accent: #7cc7ff; --btn: #fff; --btn-text: #0c0c0c;
    --ease: cubic-bezier(.16,1,.3,1);
    --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #ebebea; --panel: #fff; --panel-3: #e4e4e3;
    --text: #0f0f0f; --muted: rgba(15,15,15,.64); --dim: rgba(15,15,15,.45);
    --accent: #0a7fd0; --btn: #0f0f0f; --btn-text: #fff;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 16px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
  ::selection { background: var(--accent); color: #0c0c0c; }

  .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 40px); }

  header { padding-top: 20px; }
  header .container { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .logo { display: inline-flex; align-items: center; gap: 12px; }
  .logo-mark { width: 36px; height: 36px; flex: none; overflow: visible; color: var(--text); }
  .logo-mark .c { fill: none; stroke: currentColor; stroke-width: 9; stroke-linecap: round; }
  .logo-mark .ph path { stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; }
  .logo-mark .ph rect { fill: var(--accent); }
  .logo-word { font-size: 15px; font-weight: 700; letter-spacing: -.03em; }
  .tag {
    font-size: 13px; font-weight: 600; color: var(--muted);
    padding: 6px 12px; border-radius: 999px; background: var(--panel);
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  main { flex: 1; padding: clamp(28px, 5vh, 56px) 0 40px; }
  .meta { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 20px 32px; margin-bottom: 20px; }
  .kicker { font-size: 13px; font-weight: 600; color: var(--dim); margin: 0 0 8px; }
  h1 { margin: 0; font-size: clamp(28px, 3.6vw, 48px); font-weight: 700; line-height: 1.05; letter-spacing: -.035em; text-wrap: balance; }
  .facts { display: flex; gap: 24px; margin: 0; font-size: 14px; color: var(--muted); }
  .facts dt { font-size: 12px; color: var(--dim); font-weight: 600; }
  .facts dd { margin: 0; font-variant-numeric: tabular-nums; color: var(--text); font-weight: 500; }

  .player {
    background: #000; border-radius: 22px; overflow: hidden;
    display: grid; place-items: center;
  }
  .player video {
    display: block; width: 100%; height: auto;
    max-height: min(78vh, 78dvh);
    aspect-ratio: {{W}} / {{H}};
    background: #000;
  }
  .player.is-vertical video { width: auto; max-width: 100%; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .btn {
    display: inline-flex; align-items: center; gap: 12px;
    height: 46px; padding: 0 8px 0 20px; border-radius: 999px;
    background: var(--btn); color: var(--btn-text);
    font-size: 15px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap;
    transition: transform .3s var(--ease);
  }
  .btn:active { transform: scale(.97); }
  .btn .ic {
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%;
    background: var(--btn-text); color: var(--btn);
  }
  .btn--ghost { background: var(--panel-3); color: var(--text); }
  .btn--ghost .ic { background: var(--text); color: var(--panel-3); }
  .btn .sub { font-weight: 500; opacity: .6; font-variant-numeric: tabular-nums; }
  .hint { margin: 14px 0 0; font-size: 14px; color: var(--dim); max-width: 60ch; }

  footer { padding: 24px 0 28px; font-size: 13px; color: var(--dim); }
  footer .container { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }
  footer a:hover { color: var(--text); }

  @media (max-width: 560px) {
    .logo-word { display: none; }
    .player { border-radius: 16px; margin: 0 calc(-1 * clamp(16px, 3vw, 40px) + 8px); }
    .btn { flex: 1 1 100%; }
    .btn .sub { margin-left: auto; }
  }
</style>
</head>
<body>
<header>
  <div class="container">
    <a class="logo" href="/" aria-label="Creatives by Andrej">
      <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true"><path class="c" d="M44 44A17 17 0 1 1 44 20"/><g class="ph"><path d="M54 17V52"/><rect x="49" y="8" width="10" height="11" rx="3"/></g></svg>
      <span class="logo-word">Creatives by Andrej</span>
    </a>
    <span class="tag">{{T_TAG}}</span>
  </div>
</header>

<main>
  <div class="container">
    <div class="meta">
      <div>
        <p class="kicker">{{KICKER}}</p>
        <h1>{{TITLE}}</h1>
      </div>
      <dl class="facts">
        <div><dt>{{T_LENGTH}}</dt><dd>{{DURATION}}</dd></div>
        <div><dt>{{T_FORMAT}}</dt><dd>{{W}}×{{H}}</dd></div>
        <div><dt>{{T_SENT}}</dt><dd>{{DATE}}</dd></div>
      </dl>
    </div>

    <div class="player{{VERTICAL}}">
      <video id="v" src="{{VIDEO}}" poster="{{POSTER}}" controls playsinline preload="metadata" width="{{W}}" height="{{H}}"></video>
    </div>

    <div class="actions">
      <a class="btn" href="{{VIDEO}}" download="{{DOWNLOAD_NAME}}">
        {{T_DOWNLOAD}} <span class="sub">{{SIZE}}</span>
        <span class="ic"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 2v8M3.5 6.5 7 10l3.5-3.5M2.5 12.5h9"/></svg></span>
      </a>
      <a class="btn btn--ghost" id="fb" href="#">
        {{T_FEEDBACK}} <span class="sub" id="fbTime">0:00</span>
        <span class="ic"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11L11 3M5 3h6v6"/></svg></span>
      </a>
    </div>
    <p class="hint">{{T_HINT}}</p>
  </div>
</main>

<footer>
  <div class="container">
    <span>{{T_PRIVATE}}</span>
    <a href="mailto:creativesbyandrej@gmail.com">creativesbyandrej@gmail.com</a>
  </div>
</footer>

<script>
  (function () {
    var v = document.getElementById('v');
    var fb = document.getElementById('fb');
    var fbTime = document.getElementById('fbTime');
    var title = {{TITLE_JSON}};
    var subject = {{FB_SUBJECT_JSON}};
    function fmt(t) {
      t = Math.floor(t || 0);
      var m = Math.floor(t / 60), s = t % 60;
      return m + ':' + (s < 10 ? '0' : '') + s;
    }
    function update() { fbTime.textContent = fmt(v.currentTime); }
    v.addEventListener('timeupdate', update);
    v.addEventListener('seeked', update);
    fb.addEventListener('click', function (e) {
      e.preventDefault();
      v.pause();
      var at = fmt(v.currentTime);
      location.href = 'mailto:creativesbyandrej@gmail.com'
        + '?subject=' + encodeURIComponent(subject + ': ' + title)
        + '&body=' + encodeURIComponent('[' + at + '] \n\n' + location.href);
    });
  })();
</script>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
